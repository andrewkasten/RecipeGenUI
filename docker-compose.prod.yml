# Production compose for genui (recipes.andrewkasten.cv) — co-located on the
# same EC2 as ImpactDesk. ImpactDesk's nginx terminates TLS and proxies into
# this stack; we do NOT bind 80/443 here.
#
# Usage:
#   ./run-compose-prod.sh
#
# Project name is forced to "genui" in run-compose-prod.sh so containers,
# networks, and the postgres volume don't collide with ImpactDesk's stack.

services:
  api:
    build:
      context: ./backend
      dockerfile: ./Dockerfile
    # Bind only to the loopback interface on the host so the public internet
    # cannot reach Django directly — ImpactDesk's nginx (on the same host)
    # proxies to 127.0.0.1:8001.
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      - DJANGO_KEY=${DJANGO_KEY}
      - DEBUG=False
      - DB_NAME=${POSTGRES_DB}
      - DB_USER=${POSTGRES_USER}
      - DB_PASS=${POSTGRES_PASSWORD}
      - DB_HOST=db
      - DB_PORT=5432
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - USE_PROXY_SSL_HEADER=${USE_PROXY_SSL_HEADER:-True}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - PIXABAY_API_KEY=${PIXABAY_API_KEY}
      - UNSPLASH_ACCESS_KEY=${UNSPLASH_ACCESS_KEY}
      - CALORIE_NINJAS_API_KEY=${CALORIE_NINJAS_API_KEY}
      - PYTHONUNBUFFERED=1
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    expose:
      - "5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    restart: unless-stopped

  # One-shot build container: compiles the React app and copies the dist/
  # output into /opt/genui/dist on the host, which ImpactDesk's nginx serves
  # statically for recipes.andrewkasten.cv. Exits when the build is done.
  frontend-build:
    image: node:lts-alpine
    working_dir: /frontend
    environment:
      - VITE_BASE_URL=${VITE_BASE_URL}
    volumes:
      - ./frontend:/frontend
      - /opt/genui/dist:/output
    command: sh -lc "npm ci && npm run build && rm -rf /output/* && cp -r dist/. /output/"
    restart: "no"

volumes:
  postgres_data:
