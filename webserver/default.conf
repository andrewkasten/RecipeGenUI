# =============================================================================
# NGINX SNIPPET for recipes.andrewkasten.cv
#
# This file is NOT loaded by any container in this project. It is a reference
# snippet that you (or a future you) paste into ImpactDesk's nginx config on
# the EC2 host. ImpactDesk's webserver container terminates TLS for both
# domains and proxies recipes.andrewkasten.cv into this stack.
#
# To deploy:
#   1. SSH to the EC2.
#   2. Append the two `server` blocks below to ImpactDesk's
#      webserver/default.conf (alongside the impactdesk blocks).
#   3. Update ImpactDesk's docker-compose.prod.yml `webserver` service to
#      mount /opt/genui/dist as read-only:
#         volumes:
#           - /opt/genui/dist:/usr/share/nginx/html/recipes:ro
#      And add extra_hosts so it can reach the host loopback:
#         extra_hosts:
#           - "host.docker.internal:host-gateway"
#   4. Issue a cert for recipes.andrewkasten.cv via the existing certbot
#      container (HTTP-01 challenge on the webroot volume).
#   5. Reload nginx:  docker compose -f docker-compose.prod.yml exec webserver nginx -s reload
# =============================================================================

upstream genui_api { server host.docker.internal:8001; }

server {
  listen 80;
  server_name recipes.andrewkasten.cv;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  server_name recipes.andrewkasten.cv;

  ssl_certificate     /etc/letsencrypt/live/recipes.andrewkasten.cv/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/recipes.andrewkasten.cv/privkey.pem;

  # Django API — proxied to the genui api container via host loopback.
  location /api/ {
    proxy_pass http://genui_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Static React bundle, built by genui's docker-compose `frontend-build`
  # service into /opt/genui/dist on the host (mounted here as /usr/share/nginx/html/recipes).
  location / {
    root /usr/share/nginx/html/recipes;
    index index.html;
    try_files $uri $uri/ /index.html;
  }
}
